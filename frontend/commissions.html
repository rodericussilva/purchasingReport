    <body>
        <header id="header" class="header fixed-top d-flex align-items-center">

        <div class="d-flex align-items-center justify-content-between">
            <a href="/frontend/index.html" class="logo d-flex align-items-center">
            <img src="/frontend/assets/img/logo-removebg-preview.png" alt="">
            <span class="d-none d-lg-block">TS Distribuidora</span>
            </a>
            <!-- <i class="bi bi-list toggle-sidebar-btn"></i> -->
        </div>

        <div class="search-bar">
            <form class="search-form d-flex align-items-center" method="POST" action="#">
            <input type="text" name="query" placeholder="Pesquisar" title="Enter search keyword">
            <button type="submit" title="Search"><i class="bi bi-search"></i></button>
            </form>
        </div>

        </header>

        <main id="main" class="main">

            <div class="pagetitle">
                <h1>Comissões</h1>
                <nav>
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item"><a href="/frontend/index.html">Home</a></li>
                        <li class="breadcrumb-item">Tabela</li>
                        <li class="breadcrumb-item active">Comissões</li>
                    </ol>
                </nav>
            </div>

            <section class="section">
                <div class="row">
                    <div class="col-lg-12">

                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Comissões</h5>

                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label for="sellers-dropdown" class="form-label text-light mt-2">Vendedor</label>
                                        <div class="dropdown">
                                            <button class="btn btn-success dropdown-toggle w-100" type="button" id="sallers-dropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                                Selecionar Vendedor
                                            </button>
                                            <div class="dropdown-menu w-100" id="sellers-checkboxes-container">
                                                <div class="dropdown-item">
                                                    <input type="checkbox" id="select-all" class="form-check-input me-2">
                                                    <label for="select-all" class="form-check-label">Selecionar todos</label>
                                                </div>
                                                <div id="sellers-checkboxes">
                                                    <!-- suppliers dynamically rendered here -->
                                                </div>
                                            </div>
                                        </div>
                                    </div> <br>

                                    <div class="col-md-3">
                                        <label for="caount-months" class="form-label text-light mt-2">Escolha o mês</label>
                                        <select id="select-month" class="form-select">
                                            <option value="" disabled selected>Selecione um mês</option>
                                            <option value="january">Janeiro</option>
                                            <option value="february">Fevereiro</option>
                                            <option value="march">Março</option>
                                            <option value="april">Abril</option>
                                            <option value="may">Maio</option>
                                            <option value="june">Junho</option>
                                            <option value="july">Julho</option>
                                            <option value="august">Agosto</option>
                                            <option value="september">Setembro</option>
                                            <option value="october">Outubro</option>
                                            <option value="november">Novembro</option>
                                            <option value="december">Dezembro</option>
                                        </select>
                                    </div> <br>


                                <div class="col-md-3">
                                        <label for="caount-year" class="form-label text-light mt-2">Escolha o ano</label>
                                        <select id="select-year" class="form-select">
                                            <option value="" disabled selected>Selecione um ano</option>
                                            <option value="january">2026</option>
                                            <option value="february">2025</optio>
                                        </select>
                                    </div> <br>

                                    <div class="col-md-3 d-grid">
                                        <label for="calculate-commissions" class="form-label text-light black-text mt-2">Calcular</label>
                                        <button id="calculate-button" class="btn btn-success">Calcular</button>
                                    </div>

                                </div>
                
                                <div class="table-responsive">
                                    <table class="table table-striped table-bordered">
                                        <thead>
                                            <tr>
                                                <!-- infos dynamically rendered here -->
                                            </tr>
                                        </thead>
                                        <tbody id="data-table">
                                            <!-- dynamic table values -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </section>
      
            <div id="report-generation-section" class="row mb-3" style="display: none;">

                <div class="col-md-4">

                    <label for="choose-file" class="form-label text-light">Gerar Relatório</label>

                    <select id="choose-file" class="form-select">
                        <option value="" disabled selected>Selecione um formato</option>
                        <option value="pdf">PDF</option>
                        <!-- <option value="excel">Excel</option> -->
                        <!-- <option value="csv">CSV</option> -->
                    </select>

                    <div class="col-md-12 d-grid">
                        <button id="generate-report-button" class="btn btn-warning mt-2">Gerar Relatório</button>
                    </div>

                </div>

            </div>
